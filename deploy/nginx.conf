# Nginx site configuration for the Event Tickets app.
# The placeholder __DOMAIN__ is replaced by deploy.sh.

server {
    listen 80;
    listen [::]:80;

    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/event-tickets/public;
    index index.php;

    charset utf-8;

    # Uploaded banners / QR assets
    client_max_body_size 12M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never serve dotfiles (.env etc.)
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets served directly by Nginx
    location ^~ /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    # Deny access to hidden directories in public/
    location ~ /\.(?!well-known) {
        deny all;
    }
}

