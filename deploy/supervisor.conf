; Supervisor configuration for queue workers and the scheduler.
; The placeholder __APP_DIR__ is replaced by deploy.sh.

[program:event-tickets-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
redirect_stderr=true
stdout_logfile=/var/log/supervisor/event-tickets-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=60

[program:event-tickets-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/artisan schedule:work
directory=__APP_DIR__
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/event-tickets-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5